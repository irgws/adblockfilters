name: Sync AdBlock Rules

on:
  schedule:
    # 每 8 小时执行一次（UTC 0:00, 8:00, 16:00）
    - cron: '0 */8 * * *'
  # 也支持手动触发，方便测试
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出你的仓库
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. 从上游 rule Release 下载全部资源
      - name: Download release assets
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 217heidai/adblockfilters
          tag: rule
          out-file-path: rules/
          # 不下载 tarball/zipball，只要具体文件
          tarBall: false
          zipBall: false

      # 3. 检查是否有变更
      - name: Check changes
        id: changes
        run: |
          if git diff --quiet && git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 4. 有变更才提交推送
      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rules/
          git commit -m "chore: sync rules from 217heidai/adblockfilters ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push   
