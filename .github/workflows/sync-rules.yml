name: Sync AdBlock Rules

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all assets from upstream release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          UPSTREAM="217heidai/adblockfilters"
          TAG="rule"
          OUT="rules"

          mkdir -p "$OUT"

          ASSET_URLS=$(curl -sf \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${UPSTREAM}/releases/tags/${TAG}" \
            | jq -r '.assets[].browser_download_url')

          COUNT=$(echo "$ASSET_URLS" | grep -c . || true)
          echo ">>> 共找到 $COUNT 个资产"

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::未找到任何资产"
            exit 1
          fi

          while IFS= read -r url; do
            fname=$(basename "$url")
            echo ">>> 下载: $fname"
            curl -sfL -o "${OUT}/${fname}" "$url"
          done <<< "$ASSET_URLS"

          TOTAL=$(find "$OUT" -type f | wc -l)
          echo ">>> $OUT/ 目录共 $TOTAL 个文件"

          if [ "$TOTAL" -ne "$COUNT" ]; then
            echo "::error::预期 $COUNT 个文件，实际 $TOTAL 个"
            exit 1
          fi

          echo ">>> 全部下载完成"

      - name: Stage and check for changes
        id: changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync rules from 217heidai/adblockfilters ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push   
